<script>
(function () {
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var targets = Array.prototype.slice.call(document.querySelectorAll('[data-reveal], [data-stagger]'));
  function show(el) { el.classList.add('in'); }
  if (reduce || !('IntersectionObserver' in window)) { targets.forEach(show); }
  else {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) { show(e.target); io.unobserve(e.target); } });
    }, { threshold: 0.12 });
    targets.forEach(function (el) { io.observe(el); });
    setTimeout(function () { targets.forEach(function (el) {
      var r = el.getBoundingClientRect(); if (r.top < innerHeight && r.bottom > 0) show(el); }); }, 1200);
  }
  document.querySelectorAll('[data-carousel]').forEach(function (box) {
    var imgs = box.querySelectorAll('.screen img'), dots = box.querySelectorAll('.dots button');
    var cap = box.querySelector('.shot-cap'), i = 0, timer = null;
    function go(n) {
      imgs[i].classList.remove('on'); dots[i].classList.remove('on'); dots[i].setAttribute('aria-pressed', 'false');
      i = (n + imgs.length) % imgs.length;
      imgs[i].classList.add('on'); dots[i].classList.add('on'); dots[i].setAttribute('aria-pressed', 'true');
      if (cap) cap.textContent = imgs[i].alt;
    }
    function start() { if (!reduce && !timer) timer = setInterval(function () { go(i + 1); }, 3200); }
    function stop() { clearInterval(timer); timer = null; }
    dots.forEach(function (d, n) { d.addEventListener('click', function () { stop(); go(n); start(); }); });
    box.addEventListener('mouseenter', stop); box.addEventListener('mouseleave', start);
    start();
  });
})();
</script>
